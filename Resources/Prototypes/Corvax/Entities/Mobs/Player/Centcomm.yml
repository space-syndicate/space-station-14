- type: entity
  name: CentComm officer
  id: RandomHumanoidSpawnerCentcomOfficer
  suffix: Corvax
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    state: centcom
  - type: RandomHumanoidSpawner
    settings: CentcomOfficer

- type: randomHumanoidSettings
  id: CentcomOfficer
  parent: EventHumanoidCentcomm
  randomizeName: true
  components:
  - type: GhostRole
    name: ghost-role-information-centcom-officer-name
    description: ghost-role-information-centcom-officer-description
    rules: ghost-role-information-nonantagonist-rules
    raffle:
      settings: default
    job: CentcomOfficer
  - type: Loadout
    prototypes: [ CentcomOfficerGear ]
    roleLoadout: [ RoleSurvivalExtendedAntag ] # ОЦК АНТАГОНИСТ АААААААААААА

