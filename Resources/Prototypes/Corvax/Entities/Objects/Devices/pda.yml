- type: entity
  parent: BasePDA
  id: IAAPDA
  name: internal affairs agent PDA
  description: Corporation and profit are best friends.
  suffix: Corvax
  components:
  - type: Contraband
    severity: Corvax431
    allowedDepartments: []
    allowedJobs: [IAA]
  - type: Pda
    id: IAAIDCard
    penSlot:
      startingItem: PenLegal
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-lawyer
  - type: PdaBorderColor
    borderColor: "#6f6192"
  - type: Icon
    state: pda-lawyer

- type: entity
  parent: [BaseCorvaxContraband431JobsPilot, BaseSecurityPDA] # Corvax-Contraband
  id: PilotPDA
  name: pilot PDA
  description: Нas protection from cosmic radiation.
  suffix: Corvax
  components:
  - type: Pda
    id: PilotIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-seniorofficer
  - type: PdaBorderColor
    borderColor: "#A32D26"
    accentVColor: "#DFDFDF"
  - type: Icon
    state: pda-seniorofficer
  - type: EntityTableContainerFill
    containers:
      preinstalled-program-container: !type:AllSelector
        children:
        - id: CrewManifestCartridge
        - id: NotekeeperCartridge
        - id: NanoTaskCartridge
        - id: NewsReaderCartridge
        - id: WantedListCartridge
        - id: AstroNavCartridge

- type: entity
