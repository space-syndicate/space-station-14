- type: entity
  name: internal affairs agent's rubber stamp
  parent: RubberStampBase
  id: RubberStampIAA
  suffix: DO NOT MAP
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-iaa
    stampedColor: "#33CC33"
    stampState: "paper_stamp-ok"
  - type: Sprite
    layers:
    - state: stamp-iaa
      sprite: Corvax/Objects/Misc/stamps.rsi
  - type: Item
    inhandVisuals:
      left:
      - state: stamp-inhand-left
      - state: handle-inhand-left
        color: "#33CC33"
      right:
      - state: stamp-inhand-right
      - state: handle-inhand-right
        color: "#33CC33"

