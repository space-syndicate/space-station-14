- type: entity
  parent: IDCardStandard
  id: IAAIDCard
  name: internal affairs agent ID card
  components:
  - type: Sprite
    layers:
    - state: centcom
    - state: stripe_top
      color: "#92827b"
    - state: stripe_bottom
      color: "#92827b"
    - sprite: &icon-rsi Corvax/Interface/Misc/job_icons.rsi
      offset: &icon-offset -0.18750, 0.03125
      state: IAA
  - type: PresetIdCard
    job: IAA

- type: entity
  parent: IDCardStandard
  id: PilotIDCard
  name: pilot ID card
  components:
  - type: Sprite
    layers:
    - state: default
    - state: stripe_top
      color: &color-security-top "#cb0000"
    - state: stripe_bottom
      color: &color-security-bottom "#830000"
    - sprite: *icon-rsi
      offset: *icon-offset
      state: Pilot
  - type: PresetIdCard
    job: Pilot

- type: entity
  parent: IDCardStandard
  id: MagistrateIDCard
  name: magistrate's ID card
  components:
  - type: Sprite
    layers:
    - state: centcom
    - state: stripe_top
      color: "#92827b"
    - state: stripe_bottom
      color: "#92827b"
    - sprite: *icon-rsi
      offset: *icon-offset
      state: Magistrate
  - type: PresetIdCard
    job: Magistrate
