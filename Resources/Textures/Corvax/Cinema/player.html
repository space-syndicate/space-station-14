<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>cinema</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>
<video id="video" playsinline muted></video>
<script>
(function () {
    var v = document.getElementById('video');

    var videoSrc = null;
    var pendingSeek = null;
    var playStarting = false;
    var playbackRejected = false;
    v.addEventListener('loadedmetadata', function () {
        if (pendingSeek !== null) {
            try { v.currentTime = pendingSeek; } catch (e) { /* retried next sync */ }
            pendingSeek = null;
        }
    });

    function setTime(t) {
        if (v.readyState >= 1) {
            try { v.currentTime = t; } catch (e) { pendingSeek = t; }
        } else {
            pendingSeek = t;
        }
    }

    function videoStartPlayback() {
        if (playStarting || playbackRejected) return;

        // WebView owns video only. Keeping the element permanently muted makes Chromium's autoplay path stable
        // on Linux; audible cinema sound is generated and played by the game's positional AudioSystem.
        playStarting = true;
        v.muted = true;
        v.volume = 0;
        var p = v.play();
        if (p && typeof p.then === 'function') {
            p.then(function () {
                playStarting = false;
            }).catch(function () {
                // Do not repeat a rejected request every synchronization tick. A new URL resets the latch.
                playbackRejected = true;
                playStarting = false;
            });
        } else {
            playStarting = false;
        }
    }

    function applyState(url, playing, time, threshold) {
        if (!v) return;

        if (url !== videoSrc) {
            videoSrc = url;
            playbackRejected = false;
            if (url) {
                // The URL is ONLY ever assigned to video.src.
                v.src = url;
                v.load();
                setTime(time || 0);
            } else {
                v.removeAttribute('src');
                v.load();
                pendingSeek = null;
            }
        }

        v.muted = true;
        v.volume = 0;

        if (url) {
            var drift = Math.abs(v.currentTime - time);
            var t = playing ? (threshold || 0.35) : 0.05;
            if (drift > t) {
                setTime(time);
            }
        }

        if (playing && v.paused && url) {
            videoStartPlayback();
        } else if (!playing && !v.paused) {
            v.pause();
        }
    }

    window.cinema = { applyState: applyState };
})();
</script>
</body>
</html>
